<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F8F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小狐狸的日子">
<title>小狐狸的日子</title>
<style>
:root{
  --text:#2C2C2B; --sub:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface:#F0EFED; --border:#E6E5E3; --accent:#2783DE; --accent-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC; --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458; --red-soft:#FCE9E7;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--soft); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1040px; margin:0 auto; padding:24px; padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
h1{font-size:24px; margin:0}
.clock{font-size:14px; color:var(--sub)}

/* 顶部两屏切换 */
.screens{display:flex; gap:4px; background:var(--surface); border-radius:10px; padding:4px; margin-bottom:16px; max-width:320px}
.sbtn{flex:1; font:15px/1 inherit; min-height:40px; border:none; border-radius:8px; background:none; color:var(--sub); cursor:pointer}
.sbtn[aria-selected="true"]{background:var(--canvas); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.05)}

.grid{display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start}
.card{background:var(--canvas); border:1px solid var(--border); border-radius:12px}
.scene{padding:20px}
.stage{position:relative; height:168px; border-radius:8px; overflow:hidden; background:#EAF1F8; border:1px solid var(--border)}
.stage svg{position:absolute; inset:0; width:100%; height:100%}
.nameRow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 2px}
.name{font-size:18px; font-weight:600; background:none; border:none; padding:0; color:var(--text); width:60%; font-family:inherit}
.name:focus{outline:2px solid var(--accent-soft); border-radius:4px}
.tag{font-size:12px; color:var(--sub); background:var(--surface); border-radius:999px; padding:4px 10px; white-space:nowrap}
.doing{font-size:15px; min-height:48px; margin-top:6px}
.doing .when{color:var(--sub); font-size:13px; display:block; margin-top:4px}
.stats{margin-top:16px; display:grid; gap:10px}
.stat{display:grid; grid-template-columns:52px 1fr 36px; gap:8px; align-items:center; font-size:13px; color:var(--sub)}
.bar{display:block; height:6px; background:var(--surface); border-radius:999px; overflow:hidden}
.bar i{display:block; height:6px; background:var(--accent); border-radius:999px}
.bar.g i{background:var(--green)} .bar.o i{background:var(--orange)}
.val{text-align:right; font-variant-numeric:tabular-nums; color:var(--text)}
.actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font:14px/1 inherit; padding:12px 14px; min-height:44px; border-radius:8px; cursor:pointer; background:var(--canvas); color:var(--text); border:1px solid var(--border)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent-soft); border-color:#CFE6F8; color:#1B5E9E}
.btn.quiet{color:var(--sub)}
.noteBox{margin-top:12px; display:none}
.noteBox.open{display:block}
.noteBox textarea{
  width:100%; min-height:72px; resize:vertical; padding:10px 12px; border-radius:8px;
  border:1px solid var(--border); font:15px/1.5 inherit; color:var(--text); background:var(--soft);
}
.noteBox textarea:focus{outline:2px solid var(--accent-soft); border-color:#CFE6F8}
.noteBox .row{display:flex; gap:8px; margin-top:8px; align-items:center}
.noteBox small{color:var(--sub); font-size:13px}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:8px 12px 0; flex-wrap:wrap}
.tab{font:14px/1 inherit; background:none; border:none; padding:12px; min-height:44px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}
.panel{padding:16px 20px 20px; max-height:520px; overflow:auto}
.banner{margin:0 0 14px; padding:12px 14px; background:var(--accent-soft); border-radius:8px; font-size:14px; color:#1B5E9E}
ul.log{list-style:none; margin:0; padding:0}
ul.log li{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:15px}
ul.log li:last-child{border-bottom:none}
ul.log time{color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums; padding-top:2px}
.found{color:#D5803B; font-style:normal}
.withyou{color:#1B5E9E}
.diary{border-bottom:1px solid var(--border); padding:14px 0}
.diary:last-child{border-bottom:none}
.diary h3{margin:0 0 6px; font-size:15px; font-weight:600}
.diary h3 span{font-weight:400; color:var(--sub); font-size:13px; margin-left:8px}
.diary p{margin:0; max-width:70ch; white-space:pre-wrap}
.shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.item{border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--soft)}
.item b{display:block; font-size:14px}
.item small{color:var(--sub); font-size:13px}
.item .rare{font-size:12px; color:var(--orange); background:var(--orange-soft); border-radius:999px; padding:2px 8px; display:inline-block; margin-top:6px}
.skills{display:grid; gap:14px}
.skill .top{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:14px}
.skill .top small{color:var(--sub)}
.empty{color:var(--sub); font-size:14px}
.foot{margin-top:14px; font-size:13px; color:var(--sub)}

/* ===== 陪着你 ===== */
.twrap{display:grid; grid-template-columns:400px 1fr; gap:16px; align-items:start}
.timer{padding:28px 24px 24px; text-align:center}
.bigtime{font-size:56px; line-height:1.1; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:.01em}
.bigtime.idle{color:#B9B6B1}
.tstate{font-size:13px; color:var(--sub); margin-top:6px; min-height:20px}
.tinput{
  width:100%; margin-top:20px; padding:12px 14px; min-height:46px; border-radius:8px;
  border:1px solid var(--border); background:var(--soft); font:16px/1.4 inherit; color:var(--text);
}
.tinput:focus{outline:2px solid var(--accent-soft); border-color:#CFE6F8; background:var(--canvas)}
.tagRow{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; justify-content:center}
.chip{
  font:13px/1 inherit; min-height:34px; padding:9px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--border); background:var(--canvas); color:var(--sub);
}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:#CFE6F8; color:#1B5E9E; font-weight:600}
.chip.add{color:var(--sub); border-style:dashed}
.timer .actions{justify-content:center}
.foxline{
  margin-top:22px; padding-top:18px; border-top:1px solid var(--border);
  font-size:14px; color:var(--sub); min-height:44px; text-align:left;
}
.foxline b{color:var(--text); font-weight:600}
.nudge{color:#A5622C; background:var(--orange-soft); border-radius:8px; padding:8px 10px; display:block; margin-top:8px; font-size:13px}

.sum{display:flex; align-items:baseline; gap:10px; margin:0 0 16px}
.sum b{font-size:28px; font-weight:400; font-variant-numeric:tabular-nums}
.sum span{font-size:13px; color:var(--sub)}
ul.recs{list-style:none; margin:0; padding:0}
ul.recs li{border-bottom:1px solid var(--border); padding:10px 0}
ul.recs li:last-child{border-bottom:none}
.rec{display:grid; grid-template-columns:104px 1fr auto auto auto; gap:10px; align-items:center; font-size:15px}
.rec time{color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums}
.rec .ti{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rec .tg{font-size:12px; color:var(--sub); background:var(--surface); border-radius:999px; padding:3px 9px; white-space:nowrap}
.rec .ms{font-variant-numeric:tabular-nums; color:var(--text); font-size:14px; white-space:nowrap}
.rec .ed{border:none; background:none; color:var(--sub); cursor:pointer; font-size:13px; min-width:40px; min-height:40px; border-radius:8px}
.rec .ed:hover{background:var(--surface); color:var(--text)}
.editBox{margin-top:10px; padding:12px; background:var(--soft); border:1px solid var(--border); border-radius:8px; display:grid; gap:8px}
.editBox .two{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.editBox input,.editBox select{
  padding:10px 12px; min-height:44px; border-radius:8px; border:1px solid var(--border);
  font:15px/1 inherit; color:var(--text); background:var(--canvas); width:100%; font-family:inherit;
}
.editBox .sep{color:var(--sub); font-size:14px}
.editBox .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.editBox .hint{font-size:13px; color:var(--red)}
.btn.danger{color:#B4453A; border-color:#F3D6D2; background:var(--red-soft)}

.wbars{display:grid; gap:9px; margin-bottom:18px}
.wbar{display:grid; grid-template-columns:36px 1fr 62px; gap:10px; align-items:center; font-size:13px; color:var(--sub)}
.wbar .lane{height:10px; background:var(--surface); border-radius:999px; overflow:hidden}
.wbar .lane i{display:block; height:10px; background:var(--accent); border-radius:999px}
.wbar.today .lane i{background:#1B5E9E}
.wbar b{font-weight:400; color:var(--text); text-align:right; font-variant-numeric:tabular-nums}
.tagsum{display:grid; gap:8px; margin-top:4px}
.tagsum div{display:grid; grid-template-columns:96px 1fr 62px; gap:10px; align-items:center; font-size:13px; color:var(--sub)}
.tagsum .lane{height:8px; background:var(--surface); border-radius:999px; overflow:hidden}
.tagsum .lane i{display:block; height:8px; background:var(--green); border-radius:999px}
.tagsum b{font-weight:400; color:var(--text); text-align:right; font-variant-numeric:tabular-nums}
.h4{font-size:13px; color:var(--sub); margin:20px 0 10px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .dow{font-size:12px; color:var(--sub); text-align:center; padding-bottom:4px}
.cell{aspect-ratio:1/1; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums}
.cell.on{color:#12466F; font-weight:600}
.cell.today{outline:2px solid var(--accent)}
.cell.blank{background:none}

@media (max-width:820px){
  .wrap{padding:16px}
  .grid,.twrap{grid-template-columns:1fr}
  .panel{max-height:none}
  .screens{max-width:none}
  .bigtime{font-size:48px}
  .rec{grid-template-columns:92px 1fr auto; row-gap:4px}
  .rec .tg{grid-column:1/2; justify-self:start}
  .rec .ms{grid-column:2/3; justify-self:end}
  .rec .ed{grid-column:3/4; grid-row:1/3}
}
@media (prefers-reduced-motion:no-preference){
  .breathe{animation:breathe 4s ease-in-out infinite; transform-origin:center bottom}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>小狐狸的日子</h1>
    <span class="clock" id="clock"></span>
  </header>

  <nav class="screens" role="tablist" aria-label="两个屏幕">
    <button class="sbtn" role="tab" data-screen="fox" aria-selected="true">小狐狸</button>
    <button class="sbtn" role="tab" data-screen="with" aria-selected="false">陪着你</button>
  </nav>

  <!-- ================= 小狐狸 ================= -->
  <div id="screenFox">
  <div class="grid">
    <section class="card scene">
      <div class="stage">
        <svg viewBox="0 0 360 168" role="img" aria-labelledby="sceneTitle">
          <title id="sceneTitle">窗边的小狐狸</title>
          <rect id="sky" x="0" y="0" width="360" height="168" fill="#EAF1F8"/>
          <circle id="orb" cx="292" cy="42" r="16" fill="#F3D9A4"/>
          <rect x="0" y="126" width="360" height="42" fill="#EFE9DF"/>
          <rect x="40" y="104" width="78" height="22" rx="3" fill="#E2DACD"/>
          <rect x="52" y="92" width="12" height="12" rx="2" fill="#C9D8E4"/>
          <rect x="70" y="86" width="9" height="18" rx="2" fill="#CBDCC9"/>
          <g transform="translate(186,66)"><g class="breathe">
            <ellipse cx="22" cy="58" rx="46" ry="7" fill="#000" opacity=".06"/>
            <path d="M-24 52 C-52 44 -54 20 -34 16 C-22 14 -18 30 -20 44 Z" fill="#E8A06A"/>
            <path d="M-30 30 C-44 27 -46 18 -36 17 C-30 17 -28 24 -30 30 Z" fill="#FBF3EA"/>
            <ellipse cx="14" cy="36" rx="32" ry="22" fill="#EFA972"/>
            <ellipse cx="18" cy="46" rx="24" ry="12" fill="#FBF3EA"/>
            <circle cx="38" cy="18" r="19" fill="#F2B27D"/>
            <path d="M24 4 L22 -12 L36 -2 Z" fill="#F2B27D"/>
            <path d="M52 4 L56 -11 L41 -3 Z" fill="#F2B27D"/>
            <path d="M26 2 L25 -7 L33 -1 Z" fill="#D9836A"/>
            <path d="M50 2 L53 -6 L45 -1 Z" fill="#D9836A"/>
            <path d="M38 14 q16 2 16 14 q-10 6 -20 4 q-8 -4 -6 -12 z" fill="#FBF3EA"/>
            <circle id="eyeL" cx="32" cy="15" r="2.6" fill="#2C2C2B"/>
            <circle id="eyeR" cx="46" cy="15" r="2.6" fill="#2C2C2B"/>
            <path id="lidL" d="M28 15 q4 3 8 0" stroke="#2C2C2B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0"/>
            <path id="lidR" d="M42 15 q4 3 8 0" stroke="#2C2C2B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0"/>
            <circle cx="55" cy="22" r="2.4" fill="#2C2C2B"/>
          </g></g>
          <g id="prop"></g>
        </svg>
      </div>

      <div class="nameRow">
        <input class="name" id="name" aria-label="小狐狸的名字" maxlength="10">
        <span class="tag" id="mood"></span>
      </div>
      <div class="doing" id="doing"></div>

      <div class="stats" id="stats"></div>

      <div class="actions">
        <button class="btn primary" id="pat">摸摸头</button>
        <button class="btn" id="noteBtn">留一张便签</button>
      </div>

      <div class="noteBox" id="noteBox">
        <textarea id="noteText" maxlength="60" placeholder="写给它的话，比如：今天去看看阳台"></textarea>
        <div class="row">
          <button class="btn primary" id="noteSave">放在桌上</button>
          <button class="btn" id="noteCancel">算了</button>
          <small id="noteHint"></small>
        </div>
      </div>

      <div class="foot" id="foot"></div>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="log" aria-selected="true">动态</button>
        <button class="tab" role="tab" data-tab="diary" aria-selected="false">日记本</button>
        <button class="tab" role="tab" data-tab="notes" aria-selected="false">便签本</button>
        <button class="tab" role="tab" data-tab="shelf" aria-selected="false">收藏柜</button>
        <button class="tab" role="tab" data-tab="skill" aria-selected="false">在练的事</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
  </div>

  <!-- ================= 陪着你 ================= -->
  <div id="screenWith" hidden>
  <div class="twrap">
    <section class="card timer">
      <div class="bigtime idle" id="bigtime">00:00:00</div>
      <div class="tstate" id="tstate">还没开始</div>
      <input class="tinput" id="tTitle" maxlength="40" placeholder="我在做什么…" aria-label="我在做什么">
      <div class="tagRow" id="tagRow"></div>
      <div class="actions">
        <button class="btn primary" id="tStart">开始</button>
        <button class="btn" id="tPause" hidden>暂停</button>
        <button class="btn" id="tStop" hidden>结束</button>
      </div>
      <div class="foxline" id="foxline"></div>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab vtab" role="tab" data-view="day" aria-selected="true">今天</button>
        <button class="tab vtab" role="tab" data-view="week" aria-selected="false">本周</button>
        <button class="tab vtab" role="tab" data-view="month" aria-selected="false">本月</button>
      </div>
      <div class="panel" id="vpanel"></div>
    </section>
  </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   小狐狸的日子 v2.0
   - 小狐狸的一生：出生时间 + 第几个时间段 确定式生成（现在一小时一件事）
   - 陪着你：正计时，只存开始/结束两个时间戳，锁屏不影响
   ========================================================= */
var BIRTH = new Date("2026-09-26T08:00:00+08:00").getTime();
var TICK = 60*60*1000;
var MAX_TICKS = 24*500;
var DEFAULT_NAME = "小狐狸";
var KEY = "fox_life_v4";
var OLDKEY = "fox_life_v3";
var DEFAULT_TAGS = ["心统","普心","实验","发展教育","英语","生化","细胞","神经科学","读论文","休息","杂事"];

/* ---- 存档 ---- */
var storeOK = false;
try { localStorage.setItem(KEY+"_t","1"); localStorage.removeItem(KEY+"_t"); storeOK = true; } catch(e){ storeOK = false; }
function readPrefs(){
  if (!storeOK) return {};
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
    var old = localStorage.getItem(OLDKEY);
    if (old) return JSON.parse(old);
  } catch(e){}
  return {};
}
function writePrefs(){
  if (!storeOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch(e){}
}
var prefs = readPrefs();
if (!prefs.name) prefs.name = DEFAULT_NAME;
if (!Array.isArray(prefs.notes)) prefs.notes = [];
if (!Array.isArray(prefs.tags) || !prefs.tags.length) prefs.tags = DEFAULT_TAGS.slice();
if (!Array.isArray(prefs.records)) prefs.records = [];
if (!prefs.timer || typeof prefs.timer !== "object") prefs.timer = null;
if (!prefs.lastTag) prefs.lastTag = prefs.tags[0];

/* ---- 确定式随机 ---- */
function mulberry(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function pick(arr, r){ return arr[Math.floor(r()*arr.length) % arr.length]; }

/* ---- 行为表 ---- */
var SKILLS = {obs:"观察", craft:"做手工", cook:"揉面团", plant:"养植物", read:"读书"};
var ACTS = [
  {t:"趴在窗台上等太阳升上来，尾巴在地板上扫来扫去", p:[0], s:"obs", e:6, m:4},
  {t:"用爪子把昨天捡的石头按大小重新排了一遍", p:[0,1], s:"obs", e:-3, m:3},
  {t:"给窗边那盆薄荷浇水，顺手偷吃了一片叶子", p:[0,1], s:"plant", e:-3, m:4},
  {t:"揉了一小团面，蹲在旁边盯着它慢慢发起来", p:[0,2], s:"cook", e:-6, m:6, f:16},
  {t:"在纸上画你的侧脸，画了三遍都不满意，全都收进抽屉", p:[1,2], s:"craft", e:-5, m:2},
  {t:"追着地板上那道光斑跑了半圈，撞到了椅子腿", p:[1], s:null, e:-9, m:5},
  {t:"翻你留在桌上的那本书，把看不懂的字圈了起来", p:[1,3], s:"read", e:-6, m:1},
  {t:"爬到书架最高层，只是想知道从上面往下看是什么样子", p:[1], s:"obs", e:-8, m:4},
  {t:"把毛巾叠成一个窝，又觉得不圆，拆了重叠", p:[1,2], s:"craft", e:-4, m:2},
  {t:"在阳台数楼下走过去的伞，一共七把，两把是透明的", p:[1,2], s:"obs", e:-3, m:3},

function period(h){ return h<5?3:h<9?0:h<17?1:h<21?2:3; }
function dayKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* ---- 从出生至今全量重算 ---- */
function buildLife(now){
  var st = {
    energy:70, mood:70, full:60, curio:60,
    skills:{obs:0,craft:0,cook:0,plant:0,read:0},
    log:[], diary:[], shelf:[], rain:false
  };
  var total = Math.floor((now - BIRTH)/TICK);
  if (total < 1) total = 1;
  if (total > MAX_TICKS) total = MAX_TICKS;
  var day = null, dayBuf = [], prev = null;

  for (var i=0;i<total;i++){
    var ts = BIRTH + (i+1)*TICK;
    var time = new Date(ts);
    var r = mulberry(i*2654435761 ^ 0x9E3779B9);
    var k = dayKey(time);
    if (day === null) day = k;
    if (k !== day){ diaryFor(st, day, dayBuf, ts - TICK); day = k; dayBuf = []; }

    var weather = mulberry(Math.floor(i/4)*40503 ^ 0x5F356495);
    st.rain = weather() < 0.28;

    var p = period(time.getHours());
    var pool = (st.rain ? RAIN : []).concat(ACTS).filter(function(a){ return a.p.indexOf(p) >= 0; });
    if (st.energy < 25) pool = pool.filter(function(a){ return a.e > 0; }).concat(pool);
    if (st.full < 45) pool = pool.filter(function(a){ return a.f; }).concat(pool);
    if (!pool.length) pool = ACTS;
    var act = pick(pool, r);
    for (var tries=0; tries<4 && act.t === prev; tries++) act = pick(pool, r);
    prev = act.t;

    st.energy = clamp(st.energy + act.e + 5);
    st.mood   = clamp(st.mood + act.m - 2);
    st.full   = clamp(st.full + (act.f || 0) - 5);
    st.curio  = clamp(st.curio + (act.s === "obs" ? 6 : 3) - 3);
    if (act.s) st.skills[act.s] += 1;

    var entry = {ts:ts, t:act.t, rain:st.rain};
    if (r() < 0.12){
      var cand = FINDS.filter(function(f){
        var need = f.r===3?0.05:f.r===2?0.28:f.r===1?0.65:1;
        return r() < need;
      });
      var found = cand.length ? pick(cand, r) : pick(FINDS, r);
      if (!st.shelf.some(function(x){ return x.n === found.n; })){
        st.shelf.push({n:found.n, d:found.d, r:found.r, ts:ts});
        entry.found = found.n;
        st.mood = clamp(st.mood + 6);
      }
    }
    st.log.push(entry);
    dayBuf.push(entry);
    if (st.log.length > 600) st.log = st.log.slice(-300);
  }
  st.today = dayBuf;
  return st;
}

function diaryFor(st, key, buf, ts){
  if (!buf.length) return;
  var r = mulberry(ts/TICK ^ 0x1B873593);
  var open = st.mood > 72 ? pick(["今天是好天。","今天什么都挺顺。","今天我很喜欢。"], r)
           : st.mood > 45 ? pick(["今天普普通通。","今天过得很慢。","今天没什么大事。"], r)
           : pick(["今天有点没劲。","今天屋子里太安静了。","今天我有点想你。"], r);
  var a = pick(buf, r).t, b = pick(buf, r).t;
  var got = buf.filter(function(e){ return e.found; }).map(function(e){ return e.found; });
  var lines = [open, "我" + a + "。"];
  if (b !== a) lines.push("后来又" + b + "。");
  if (got.length) lines.push("捡到了" + got.join("、") + "，放进柜子了。");
  lines.push(st.energy < 35 ? "有点累，先睡了。"
            : pick(["明天想再去阳台看看。","明天你要是来，我把东西都拿给你看。","晚安。"], r));
  st.diary.unshift({key:key, ts:ts, text:lines.join("\n"), mood:st.mood});
  if (st.diary.length > 60) st.diary.pop();
}

function two(n){ return ("0"+n).slice(-2); }
function fmt(ts){
  var d = new Date(ts), t = two(d.getHours())+":"+two(d.getMinutes());

}
function hm(ts){ var d = new Date(ts); return two(d.getHours())+":"+two(d.getMinutes()); }
function dur(ms){
  var m = Math.max(0, Math.round(ms/60000));

  return h ? (h+"h"+(m?two(m)+"m":"")) : (m+"m");
}
function hhmmss(ms){
  var s = Math.max(0, Math.floor(ms/1000));

}

function endLine(rec){

    "一整块 "+dur(rec.ms)+"。它举起爪子在空气里比了个形状，大概是奖状"

  ], r);

    for (i=0;i<7;i++){
      var d = new Date(s.getFullYear(), s.getMonth(), s.getDate()+i);
      var l = recordsOn(d), ms = l.reduce(function(a,b){ return a+b.ms; }, 0);
      days.push({d:d, ms:ms, today:sameDay(d, now)});
      if (ms > maxMs) maxMs = ms;
    }
    var wtotal = days.reduce(function(a,b){ return a+b.ms; }, 0);
    var names = ["一","二","三","四","五","六","日"];
    html += '<p class="sum"><b>'+(wtotal?dur(wtotal):"0m")+'</b><span>本周 · 平均每天 '+dur(wtotal/7)+'</span></p>';
    html += '<div class="wbars">' + days.map(function(x,k){
      return '<div class="wbar'+(x.today?" today":"")+'"><span>'+names[k]+'</span><span class="lane"><i style="width:'+Math.round(x.ms/maxMs*100)+'%"></i></span><b>'+(x.ms?dur(x.ms):"—")+'</b></div>';
    }).join("") + '</div>';
    var wl = [];
    days.forEach(function(x){ wl = wl.concat(recordsOn(x.d)); });
    var tt = tagTotals(wl);
    if (tt.length){
      var tmax = tt[0].ms || 1;
      html += '<p class="h4">按标签</p><div class="tagsum">' + tt.map(function(x){
        return '<div><span>'+escapeHtml(x.tag)+'</span><span class="lane"><i style="width:'+Math.round(x.ms/tmax*100)+'%"></i></span><b>'+dur(x.ms)+'</b></div>';
      }).join("") + '</div>';
    } else {
      html += '<p class="empty">这一周还没有记录。</p>';
    }
  } else {
    var y = now.getFullYear(), mo = now.getMonth();
    var first = new Date(y, mo, 1), lead = (first.getDay()+6)%7;
    var count = new Date(y, mo+1, 0).getDate();
    var mtotal = 0, activeDays = 0, cells = "";
    var dows = ["一","二","三","四","五","六","日"];
    for (i=0;i<7;i++) cells += '<div class="dow">'+dows[i]+'</div>';
    for (i=0;i<lead;i++) cells += '<div class="cell blank"></div>';
    for (i=1;i<=count;i++){
      var dd = new Date(y, mo, i);
      var ms2 = recordsOn(dd).reduce(function(a,b){ return a+b.ms; }, 0);
      mtotal += ms2;
      if (ms2 > 0) activeDays++;
      var k2 = Math.min(1, ms2/(4*3600000));
      var bg = ms2 ? 'background:rgba(39,131,222,'+(0.12+k2*0.68).toFixed(2)+')' : '';
      cells += '<div class="cell'+(ms2?" on":"")+(sameDay(dd,now)?" today":"")+'" style="'+bg+'" title="'+(mo+1)+'/'+i+' '+(ms2?dur(ms2):"没有记录")+'">'+i+'</div>';
    }
    html += '<p class="sum"><b>'+(mtotal?dur(mtotal):"0m")+'</b><span>'+(mo+1)+' 月 · 有记录的 '+activeDays+' 天</span></p>';
    html += '<div class="cal">'+cells+'</div>';
    html += '<p class="foot">颜色越深，那天坐得越久。空白的日子就是空白，没有别的意思。</p>';
  }
  $("vpanel").innerHTML = html;
}

function paint(){ paintScene(); paintPanel(); paintTimer(); paintViews(); }

/* ---- 切屏 / 切页签 ---- */
function selectScreen(name){
  screenNow = name;
  $("screenFox").hidden = name !== "fox";
  $("screenWith").hidden = name !== "with";
  Array.prototype.forEach.call(document.querySelectorAll(".sbtn"), function(b){
    b.setAttribute("aria-selected", String(b.dataset.screen === name));
  });
  if (name === "with"){ paintTimer(); paintViews(); } else { paintScene(); paintPanel(); }
}
function selectTab(name){
  tab = name;
  Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function(x){
    x.setAttribute("aria-selected", String(x.dataset.tab === name));
  });
  paintPanel();
}
function selectView(name){
  view = name; editingId = null;
  Array.prototype.forEach.call(document.querySelectorAll(".vtab"), function(x){
    x.setAttribute("aria-selected", String(x.dataset.view === name));
  });
  paintViews();
}

Array.prototype.forEach.call(document.querySelectorAll(".sbtn"), function(b){
  b.addEventListener("click", function(){ selectScreen(b.dataset.screen); });
});
Array.prototype.forEach.call(document.querySelectorAll("[data-tab]"), function(b){
  b.addEventListener("click", function(){ selectTab(b.dataset.tab); });
});
Array.prototype.forEach.call(document.querySelectorAll(".vtab"), function(b){
  b.addEventListener("click", function(){ selectView(b.dataset.view); });
});

/* ---- 小狐狸屏交互 ---- */
$("name").addEventListener("change", function(){
  prefs.name = this.value.trim() || DEFAULT_NAME;
  this.value = prefs.name;
  writePrefs();
  $("foot").textContent = storeOK
    ? "名字记下了：" + prefs.name + "。下次打开还是它。"
    : "名字只能在这次打开期间用。想要永久改名，告诉许墨就行。";
});

$("pat").addEventListener("click", function(){
  st.mood = clamp(st.mood + 5);
  var r = mulberry(Date.now() & 0xFFFFFF);
  session.push({ts:Date.now(), t:pick([
    "被你摸了头，假装不在意，尾巴却摇了",
    "把脑袋往你手里又顶了一下",
    "眼睛闭起来，喉咙里哼了一声",
    "翻过身把肚皮朝上，这是它最大的让步"
  ], r), rain:st.rain});
  selectTab("log"); paintScene();
});

$("noteBtn").addEventListener("click", function(){
  $("noteBox").classList.add("open");
  $("noteText").focus();
});
$("noteCancel").addEventListener("click", function(){
  $("noteBox").classList.remove("open");
});
$("noteSave").addEventListener("click", function(){
  var v = $("noteText").value.trim();
  if (!v){ $("noteHint").textContent = "先写一句话。"; return; }
  var note = v.slice(0,60);
  var now = Date.now();
  prefs.notes.unshift({ts:now, text:note});
  if (prefs.notes.length > 200) prefs.notes = prefs.notes.slice(0,200);
  writePrefs();
  session.push({ts:now, t:"发现桌上多了一张便签，读了三遍：「"+note+"」", rain:st.rain});
  var r = mulberry(now & 0xFFFFFF);
  session.push({ts:now+1000, t:pick([
    "把便签叠成小方块收进口袋，然后去做你写的那件事了",
    "照着便签试了一遍，回头看了看门口，想知道你什么时候回来",
    "把便签压在石头底下，这样风就吹不跑了"
  ], r), rain:st.rain});
  st.mood = clamp(st.mood + 4);
  st.skills.read += 1;
  $("noteText").value = "";
  $("noteHint").textContent = "它看到了。";
  $("noteBox").classList.remove("open");
  selectTab("log"); paintScene();
});

/* ---- 计时交互 ---- */
$("tagRow").addEventListener("click", function(ev){
  var add = ev.target.closest("#tagAdd");
  if (add){
    var name = (window.prompt("新标签叫什么？", "") || "").trim().slice(0,8);
    if (name && prefs.tags.indexOf(name) < 0){
      prefs.tags.push(name);
      prefs.lastTag = name;
      writePrefs();
      paintTags();
    }
    return;
  }
  var chip = ev.target.closest("[data-tag]");
  if (!chip) return;
  var g = chip.dataset.tag;
  prefs.lastTag = (prefs.lastTag === g) ? "" : g;
  writePrefs();
  paintTags();
});
$("tagRow").addEventListener("contextmenu", function(ev){
  var chip = ev.target.closest("[data-tag]");
  if (!chip) return;
  ev.preventDefault();
  var g = chip.dataset.tag;
  if (window.confirm("删掉标签「"+g+"」吗？已经记下的记录不会受影响。")){
    prefs.tags = prefs.tags.filter(function(x){ return x !== g; });
    if (prefs.lastTag === g) prefs.lastTag = "";
    writePrefs(); paintTags();
  }
});

$("tStart").addEventListener("click", function(){
  var now = Date.now();
  prefs.timer = {start:now, startedAt:now, acc:0, running:true, hidden:0};
  writePrefs();
  paintTimer();
});
$("tPause").addEventListener("click", function(){
  var t = prefs.timer; if (!t) return;
  if (t.running){
    t.acc += Date.now() - t.startedAt;
    t.running = false; t.startedAt = null;
  } else {
    t.startedAt = Date.now(); t.running = true;
  }
  writePrefs(); paintTimer();
});
$("tStop").addEventListener("click", function(){
  var t = prefs.timer; if (!t) return;
  var ms = elapsed();
  var end = Date.now();
  if (ms < 30000){
    if (!window.confirm("还不到半分钟，也要记下来吗？")){ return; }
  }
  var rec = {
    id: "r"+t.start,
    start: t.start,
    end: end,
    ms: ms,
    title: $("tTitle").value.trim().slice(0,40),
    tag: prefs.lastTag || ""
  };
  prefs.records.push(rec);
  prefs.records.sort(function(a,b){ return a.start - b.start; });
  prefs.timer = null;
  writePrefs();
  $("tTitle").value = "";
  st.mood = clamp(st.mood + Math.min(8, Math.round(ms/600000)));
  paintTimer(); paintViews(); paintScene(); paintPanel();
});

/* ---- 记录编辑 ---- */
$("vpanel").addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.dataset.act;
  if (act === "edit"){ editingId = btn.dataset.id; paintViews(); return; }
  if (act === "cancel"){ editingId = null; paintViews(); return; }
  if (act === "del"){
    if (!window.confirm("删掉这一条记录吗？")) return;
    prefs.records = prefs.records.filter(function(r){ return r.id !== btn.dataset.id; });
    editingId = null; writePrefs(); paintViews(); paintScene(); paintPanel();
    return;
  }
  if (act === "save"){
    var box = $("vpanel").querySelector('.editBox[data-id="'+btn.dataset.id+'"]');
    var rec = prefs.records.filter(function(r){ return r.id === btn.dataset.id; })[0];
    if (!box || !rec) return;
    var sv = box.querySelector('[data-f="s"]').value;
    var evv = box.querySelector('[data-f="e"]').value;
    var hint = box.querySelector('[data-hint]');
    if (!sv || !evv){ hint.textContent = "时间不能空着。"; return; }
    var base = new Date(rec.start);
    function mk(v){
      var p = v.split(":");
      return new Date(base.getFullYear(), base.getMonth(), base.getDate(), +p[0], +p[1], 0, 0).getTime();
    }
    var s2 = mk(sv), e2 = mk(evv);
    if (e2 <= s2) e2 += 86400000;
    if (e2 - s2 > 20*3600000){ hint.textContent = "这段时间太长了，检查一下。"; return; }
    rec.start = s2; rec.end = e2; rec.ms = e2 - s2;
    rec.title = box.querySelector('[data-f="t"]').value.trim().slice(0,40);
    rec.tag = box.querySelector('[data-f="g"]').value;
    prefs.records.sort(function(a,b){ return a.start - b.start; });
    editingId = null; writePrefs(); paintViews(); paintScene(); paintPanel();
  }
});

/* ---- 摸鱼计数 ---- */
document.addEventListener("visibilitychange", function(){
  var t = prefs.timer;
  if (!t || !t.running) return;
  if (document.hidden){
    t.hidden = (t.hidden || 0) + 1;
    writePrefs();
  } else {
    paintTimer();
  }
});

/* ---- 心跳 ---- */
paintTags();
paint();
setInterval(function(){
  if (prefs.timer) paintTimer();
}, 1000);
setInterval(function(){
  var fresh = buildLife(Date.now());
  if (fresh.log.length !== st.log.length){
    st = fresh;
    if (screenNow === "fox"){ paintScene(); paintPanel(); } else { paintFoxline(); }
  }
}, 60*1000);
})();
</script>
