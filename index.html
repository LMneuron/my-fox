<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F8F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小狐狸的日子">
<title>小狐狸的日子</title>
<style>
:root{
  --text:#2C2C2B; --sub:#7D7A75; --canvas:#FFFFFF; --soft:#F9F8F7;
  --surface:#F0EFED; --border:#E6E5E3; --accent:#2783DE; --accent-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC; --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458; --red-soft:#FCE9E7;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--soft); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1040px; margin:0 auto; padding:24px; padding-top:calc(16px + env(safe-area-inset-top)); padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
h1{font-size:24px; margin:0}
.clock{font-size:14px; color:var(--sub)}

.screens{display:flex; gap:4px; background:var(--surface); border-radius:10px; padding:4px; margin-bottom:16px; max-width:440px}
.sbtn{flex:1; font:15px/1 inherit; min-height:40px; border:none; border-radius:8px; background:none; color:var(--sub); cursor:pointer}
.sbtn[aria-selected="true"]{background:var(--canvas); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.05)}

.grid{display:grid; grid-template-columns:360px 1fr; gap:16px; align-items:start}
.card{background:var(--canvas); border:1px solid var(--border); border-radius:12px}
.scene{padding:20px}
.stage{position:relative; height:168px; border-radius:8px; overflow:hidden; background:#EAF1F8; border:1px solid var(--border)}
.stage svg{position:absolute; inset:0; width:100%; height:100%}
.nameRow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 2px}
.name{font-size:18px; font-weight:600; background:none; border:none; padding:0; color:var(--text); width:60%; font-family:inherit}
.name:focus{outline:2px solid var(--accent-soft); border-radius:4px}
.tag{font-size:12px; color:var(--sub); background:var(--surface); border-radius:999px; padding:4px 10px; white-space:nowrap}
.doing{font-size:15px; min-height:48px; margin-top:6px}
.doing .when{color:var(--sub); font-size:13px; display:block; margin-top:4px}
.stats{margin-top:16px; display:grid; gap:10px}
.stat{display:grid; grid-template-columns:52px 1fr 36px; gap:8px; align-items:center; font-size:13px; color:var(--sub); cursor:pointer; padding:6px; border-radius:6px; transition:background 0.2s}
.stat:hover{background:var(--soft)}
.stat:active{transform:scale(0.98)}
.bar{display:block; height:6px; background:var(--surface); border-radius:999px; overflow:hidden}
.bar i{display:block; height:6px; background:var(--accent); border-radius:999px; transition:width 0.4s ease}
.bar.g i{background:var(--green)} .bar.o i{background:var(--orange)}
.val{text-align:right; font-variant-numeric:tabular-nums; color:var(--text)}
.actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font:14px/1 inherit; padding:12px 14px; min-height:44px; border-radius:8px; cursor:pointer; background:var(--canvas); color:var(--text); border:1px solid var(--border)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent-soft); border-color:#CFE6F8; color:#1B5E9E}
.btn.quiet{color:var(--sub)}
.noteBox{margin-top:12px; display:none}
.noteBox.open{display:block}
.noteBox textarea{
  width:100%; min-height:72px; resize:vertical; padding:10px 12px; border-radius:8px;
  border:1px solid var(--border); font:15px/1.5 inherit; color:var(--text); background:var(--soft);
}
.noteBox textarea:focus{outline:2px solid var(--accent-soft); border-color:#CFE6F8}
.noteBox .row{display:flex; gap:8px; margin-top:8px; align-items:center}
.noteBox small{color:var(--sub); font-size:13px}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); padding:8px 12px 0; flex-wrap:wrap}
.tab{font:14px/1 inherit; background:none; border:none; padding:12px; min-height:44px; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}
.panel{padding:16px 20px 20px; max-height:520px; overflow:auto}
.banner{margin:0 0 14px; padding:12px 14px; background:var(--accent-soft); border-radius:8px; font-size:14px; color:#1B5E9E}
ul.log{list-style:none; margin:0; padding:0}
ul.log li{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:15px}
ul.log li:last-child{border-bottom:none}
ul.log time{color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums; padding-top:2px}
.found{color:#D5803B; font-style:normal}
.withyou{color:#1B5E9E}
.placeLine{display:block; font-size:12px; color:var(--sub); margin-top:4px}

.diary{border-bottom:1px solid var(--border); padding:14px 0}
.diary:last-child{border-bottom:none}
.diary h3{margin:0 0 6px; font-size:15px; font-weight:600}
.diary h3 span{font-weight:400; color:var(--sub); font-size:13px; margin-left:8px}
.diary p{margin:0; max-width:70ch; white-space:pre-wrap}
.shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.item{border:1px solid var(--border); border-radius:8px; padding:12px; background:var(--soft)}
.item b{display:block; font-size:14px}
.item small{color:var(--sub); font-size:13px}
.item .rare{font-size:12px; color:var(--orange); background:var(--orange-soft); border-radius:999px; padding:2px 8px; display:inline-block; margin-top:6px}

.custom-find-box { margin-top: 20px; padding: 16px; background: var(--surface); border-radius: 8px; border: 1px dashed var(--sub); }
.custom-find-box p { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; }
.custom-find-box input { width: 100%; padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 14px;}
.custom-find-box button { width: 100%; }

.skills{display:grid; gap:14px}
.skill .top{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; font-size:14px}
.skill .top small{color:var(--sub)}
.empty{color:var(--sub); font-size:14px}
.foot{margin-top:14px; font-size:13px; color:var(--sub)}

.twrap{display:grid; grid-template-columns:400px 1fr; gap:16px; align-items:start}
.timer{padding:28px 24px 24px; text-align:center}
.bigtime{font-size:56px; line-height:1.1; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:.01em}
.bigtime.idle{color:#B9B6B1}
.tstate{font-size:13px; color:var(--sub); margin-top:6px; min-height:20px}
.tinput{
  width:100%; margin-top:20px; padding:12px 14px; min-height:46px; border-radius:8px;
  border:1px solid var(--border); background:var(--soft); font:16px/1.4 inherit; color:var(--text);
}
.tinput:focus{outline:2px solid var(--accent-soft); border-color:#CFE6F8; background:var(--canvas)}
.tagRow{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; justify-content:center}
.chip{
  font:13px/1 inherit; min-height:34px; padding:9px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--border); background:var(--canvas); color:var(--sub);
}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:#CFE6F8; color:#1B5E9E; font-weight:600}
.chip.add{color:var(--sub); border-style:dashed}
.timer .actions{justify-content:center}
.foxline{
  margin-top:22px; padding-top:18px; border-top:1px solid var(--border);
  font-size:14px; color:var(--sub); min-height:44px; text-align:left;
}
.foxline b{color:var(--text); font-weight:600}
.nudge{color:#A5622C; background:var(--orange-soft); border-radius:8px; padding:8px 10px; display:block; margin-top:8px; font-size:13px}

.sum{display:flex; align-items:baseline; gap:10px; margin:0 0 16px}
.sum b{font-size:28px; font-weight:400; font-variant-numeric:tabular-nums}
.sum span{font-size:13px; color:var(--sub)}
ul.recs{list-style:none; margin:0; padding:0}
ul.recs li{border-bottom:1px solid var(--border); padding:10px 0}
ul.recs li:last-child{border-bottom:none}
.rec{display:grid; grid-template-columns:104px 1fr auto auto auto; gap:10px; align-items:center; font-size:15px}
.rec time{color:var(--sub); font-size:13px; font-variant-numeric:tabular-nums}
.rec .ti{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rec .tg{font-size:12px; color:var(--sub); background:var(--surface); border-radius:999px; padding:3px 9px; white-space:nowrap}
.rec .ms{font-variant-numeric:tabular-nums; color:var(--text); font-size:14px; white-space:nowrap}
.rec .ed{border:none; background:none; color:var(--sub); cursor:pointer; font-size:13px; min-width:40px; min-height:40px; border-radius:8px}
.rec .ed:hover{background:var(--surface); color:var(--text)}
.editBox{margin-top:10px; padding:12px; background:var(--soft); border:1px solid var(--border); border-radius:8px; display:grid; gap:8px}
.editBox .two{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.editBox input,.editBox select{
  padding:10px 12px; min-height:44px; border-radius:8px; border:1px solid var(--border);
  font:15px/1 inherit; color:var(--text); background:var(--canvas); width:100%; font-family:inherit;
}
.editBox .sep{color:var(--sub); font-size:14px}
.editBox .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.editBox .hint{font-size:13px; color:var(--red)}
.btn.danger{color:#B4453A; border-color:#F3D6D2; background:var(--red-soft)}

.wbars{display:grid; gap:9px; margin-bottom:18px}
.wbar{display:grid; grid-template-columns:36px 1fr 62px; gap:10px; align-items:center; font-size:13px; color:var(--sub)}
.wbar .lane{height:10px; background:var(--surface); border-radius:999px; overflow:hidden}
.wbar .lane i{display:block; height:10px; background:var(--accent); border-radius:999px}
.wbar.today .lane i{background:#1B5E9E}
.wbar b{font-weight:400; color:var(--text); text-align:right; font-variant-numeric:tabular-nums}
.tagsum{display:grid; gap:8px; margin-top:4px}
.tagsum div{display:grid; grid-template-columns:96px 1fr 62px; gap:10px; align-items:center; font-size:13px; color:var(--sub)}
.tagsum .lane{height:8px; background:var(--surface); border-radius:999px; overflow:hidden}
.tagsum .lane i{display:block; height:8px; background:var(--green); border-radius:999px}
.tagsum b{font-weight:400; color:var(--text); text-align:right; font-variant-numeric:tabular-nums}
.h4{font-size:13px; color:var(--sub); margin:20px 0 10px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal .dow{font-size:12px; color:var(--sub); text-align:center; padding-bottom:4px}
.cell{aspect-ratio:1/1; border-radius:6px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--sub); font-variant-numeric:tabular-nums}
.cell.on{color:#12466F; font-weight:600}
.cell.today{outline:2px solid var(--accent)}
.cell.blank{background:none}

.mapCard{padding:18px}
.mapHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}
.mapHead h2{font-size:20px;margin:0 0 3px}
.mapHead p{margin:0;color:var(--sub);font-size:13px}
.mapClock{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.mapWrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#F3F0E8}
.mapSvg{display:block;width:100%;height:auto;min-height:340px}
.route{fill:none;stroke:#C9C2B6;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}
.placeNode{cursor:pointer}
.placeNode .bubble{fill:#FFF;stroke:#DCD8D0;stroke-width:2}
.placeNode.active .bubble{stroke:#D5803B;stroke-width:3}
.placeNode text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#3B3936}
.placeNode .emoji{font-size:25px}
.placeNode .label{font-size:14px;font-weight:600}
.foxMarker{transition:transform .5s ease}
.mapInfo{margin-top:12px;padding:14px;background:var(--soft);border:1px solid var(--border);border-radius:10px;min-height:88px}
.mapInfo .placeTitle{font-weight:600;font-size:16px;margin-bottom:5px}
.mapInfo .placeMeta{color:var(--sub);font-size:13px;margin-bottom:7px}
.mapInfo .placeText{font-size:15px;white-space:pre-line}
.mapLegend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mapChip{font-size:12px;color:var(--sub);background:var(--surface);border-radius:999px;padding:5px 9px}
.mapFoot{margin:12px 2px 0;color:var(--sub);font-size:13px}

@media (max-width:820px){
  .wrap{padding:16px}
  .grid,.twrap{grid-template-columns:1fr}
  .panel{max-height:none}
  .screens{max-width:none}
  .bigtime{font-size:48px}
  .rec{grid-template-columns:92px 1fr auto; row-gap:4px}
  .rec .tg{grid-column:1/2; justify-self:start}
  .rec .ms{grid-column:2/3; justify-self:end}
  .rec .ed{grid-column:3/4; grid-row:1/3}
  .mapCard{padding:14px}
  .mapSvg{min-height:300px}
  .mapHead h2{font-size:18px}
  .mapHead p{font-size:12px}
}
@media (prefers-reduced-motion:no-preference){
  .breathe{animation:breathe 4s ease-in-out infinite; transform-origin:center bottom}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>小狐狸的日子</h1>
  <span class="clock" id="clock"></span>
</header>

<nav class="screens" role="tablist" aria-label="三个屏幕">
  <button class="sbtn" role="tab" data-screen="fox" aria-selected="true">小狐狸</button>
  <button class="sbtn" role="tab" data-screen="with" aria-selected="false">陪着你</button>
  <button class="sbtn" role="tab" data-screen="map" aria-selected="false">狐狸地图</button>
</nav>

<div id="screenFox">
  <div class="grid">
    <section class="card scene">
      <div class="stage">
        <svg viewBox="0 0 360 168" role="img" aria-labelledby="sceneTitle">
          <title id="sceneTitle">窗边的小狐狸</title>
          <rect id="sky" x="0" y="0" width="360" height="168" fill="#EAF1F8"/>
          <circle id="orb" cx="292" cy="42" r="16" fill="#F3D9A4"/>
          <rect x="0" y="126" width="360" height="42" fill="#EFE9DF"/>
          <rect x="40" y="104" width="78" height="22" rx="3" fill="#E2DACD"/>
          <rect x="52" y="92" width="12" height="12" rx="2" fill="#C9D8E4"/>
          <rect x="70" y="86" width="9" height="18" rx="2" fill="#CBDCC9"/>
          <g transform="translate(186,66)"><g class="breathe">
            <ellipse cx="22" cy="58" rx="46" ry="7" fill="#000" opacity=".06"/>
            <path d="M-24 52 C-52 44 -54 20 -34 16 C-22 14 -18 30 -20 44 Z" fill="#E8A06A"/>
            <path d="M-30 30 C-44 27 -46 18 -36 17 C-30 17 -28 24 -30 30 Z" fill="#FBF3EA"/>
            <ellipse cx="14" cy="36" rx="32" ry="22" fill="#EFA972"/>
            <ellipse cx="18" cy="46" rx="24" ry="12" fill="#FBF3EA"/>
            <circle cx="38" cy="18" r="19" fill="#F2B27D"/>
            <path d="M24 4 L22 -12 L36 -2 Z" fill="#F2B27D"/>
            <path d="M52 4 L56 -11 L41 -3 Z" fill="#F2B27D"/>
            <path d="M26 2 L25 -7 L33 -1 Z" fill="#D9836A"/>
            <path d="M50 2 L53 -6 L45 -1 Z" fill="#D9836A"/>
            <path d="M38 14 q16 2 16 14 q-10 6 -20 4 q-8 -4 -6 -12 z" fill="#FBF3EA"/>
            <circle id="eyeL" cx="32" cy="15" r="2.6" fill="#2C2C2B"/>
            <circle id="eyeR" cx="46" cy="15" r="2.6" fill="#2C2C2B"/>
            <path id="lidL" d="M28 15 q4 3 8 0" stroke="#2C2C2B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0"/>
            <path id="lidR" d="M42 15 q4 3 8 0" stroke="#2C2C2B" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0"/>
            <circle cx="55" cy="22" r="2.4" fill="#2C2C2B"/>
          </g></g>
          <g id="prop"></g>
        </svg>
      </div>

      <div class="nameRow">
        <input class="name" id="name" aria-label="小狐狸的名字" maxlength="10">
        <span class="tag" id="mood"></span>
      </div>
      <div class="doing" id="doing"></div>

      <div class="stats" id="stats" title="点一下试试！"></div>

      <div class="actions">
        <button class="btn primary" id="pat">摸摸头</button>
        <button class="btn" id="noteBtn">留一张便签</button>
      </div>

      <div class="noteBox" id="noteBox">
        <textarea id="noteText" maxlength="60" placeholder="写给它的话，比如：今天去看看阳台"></textarea>
        <div class="row">
          <button class="btn primary" id="noteSave">放在桌上</button>
          <button class="btn" id="noteCancel">算了</button>
          <small id="noteHint"></small>
        </div>
      </div>

      <div class="foot" id="foot"></div>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="log" aria-selected="true">动态</button>
        <button class="tab" role="tab" data-tab="diary" aria-selected="false">日记本</button>
        <button class="tab" role="tab" data-tab="notes" aria-selected="false">便签本</button>
        <button class="tab" role="tab" data-tab="shelf" aria-selected="false">收藏柜</button>
        <button class="tab" role="tab" data-tab="skill" aria-selected="false">在练的事</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</div>

<div id="screenWith" hidden>
  <div class="twrap">
    <section class="card timer">
      <div class="bigtime idle" id="bigtime">00:00:00</div>
      <div class="tstate" id="tstate">还没开始</div>
      <input class="tinput" id="tTitle" maxlength="40" placeholder="我在做什么…" aria-label="我在做什么">
      <div class="tagRow" id="tagRow"></div>
      <div class="actions">
        <button class="btn primary" id="tStart">开始</button>
        <button class="btn" id="tPause" hidden>暂停</button>
        <button class="btn" id="tStop" hidden>结束</button>
      </div>
      <div class="foxline" id="foxline"></div>
    </section>

    <section class="card">
      <div class="tabs" role="tablist">
        <button class="tab vtab" role="tab" data-view="day" aria-selected="true">今天</button>
        <button class="tab vtab" role="tab" data-view="week" aria-selected="false">本周</button>
        <button class="tab vtab" role="tab" data-view="month" aria-selected="false">本月</button>
      </div>
      <div class="panel" id="vpanel"></div>
    </section>
  </div>
</div>

<div id="screenMap" hidden>
  <div class="card mapCard">
    <div class="mapHead">
      <div>
        <h2>狐狸地图</h2>
        <p>各自过各自的小日子。偶尔在路上遇见。</p>
      </div>
      <div class="mapClock" id="mapClock"></div>
    </div>
    <div class="mapWrap">
      <svg class="mapSvg" viewBox="0 0 760 520" aria-label="小狐狸生活的地图">
        <path class="route" d="M118 370 C180 332 206 276 274 252 S398 205 470 156 S594 124 654 166"/>
        <path class="route" d="M274 252 C300 312 340 366 410 397 S522 426 602 380"/>
        <path class="route" d="M470 156 C454 216 486 270 536 302 S612 340 602 380"/>
        <path class="route" d="M274 252 C220 210 200 156 238 104"/>
        <path class="route" d="M470 156 C536 112 582 78 646 92"/>
        <path class="route" d="M118 370 C178 414 226 432 296 430"/>
        <g id="mapDecor"></g>
        <g id="mapPlaces"></g>
        <g id="foxMarker" class="foxMarker" opacity="0">
          <circle r="18" fill="#F9F8F7" stroke="#D5803B" stroke-width="2"/>
          <path d="M-9 4 L-13 -9 L-3 -5 L0 -10 L4 -5 L13 -9 L9 5 Q0 12 -9 4Z" fill="#EFA972"/>
          <circle cx="-4" cy="0" r="1.5" fill="#2C2C2B"/><circle cx="4" cy="0" r="1.5" fill="#2C2C2B"/>
        </g>
      </svg>
    </div>
    <div class="mapInfo" id="mapInfo"></div>
    <div class="mapLegend" id="mapLegend"></div>
    <p class="mapFoot">这里不会催你做什么。它有自己的路线、自己的停留，也会偶尔跑去一个你没想到的地方。</p>
  </div>
</div>
</div>

<script>
(function(){
"use strict";

var BIRTH = new Date("2026-09-26T08:00:00+08:00").getTime();
var TICK = 60*60*1000;
var MAX_TICKS = 24*500;

var realWeatherCache = { isRaining: null, lastCheck: 0 };
function fetchRealWeather() {
  if (Date.now() - realWeatherCache.lastCheck < 3600000 && realWeatherCache.isRaining !== null) return;
  fetch("https://get.geojs.io/v1/ip/geo.json")
    .then(function(res){ return res.json(); })
    .then(function(geo){
      return fetch("https://api.open-meteo.com/v1/forecast?latitude="+geo.latitude+"&longitude="+geo.longitude+"&current_weather=true");
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      var code = data.current_weather.weathercode;
      realWeatherCache.isRaining = (code >= 50 && code <= 99);
      realWeatherCache.lastCheck = Date.now();
      paintScene();

    .catch(function(e){
      console.log("真实天气获取失败，降级为随机天气");
    });
}

/* ---- 确定式随机 ---- */
function mulberry(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v){ return Math.max(0, Math.min(100, Math.round(v))); }
function pick(arr, r){ return arr[Math.floor(r()*arr.length) % arr.length]; }
function hash32(n){ n = (n ^ (n >>> 16)) * 0x45d9f3b; n = (n ^ (n >>> 16)) * 0x45d9f3b; return (n ^ (n >>> 16)) >>> 0; }

/* ---- 位置游走：按时间偏好选下一个地点 ----
   深夜想回家，白天偏工作/学习，傍晚偏休闲。
   这是两边共用的唯一入口，动态和地图都用它，保证完全一致。 */
function pickNextPlace(current, hour, randVal){
  var p = MAP_PLACES[current];
  var choices = p.neighbors.slice();
  var prefs;
  if (hour >= 22 || hour < 6) prefs = ["home"];
  else if (hour < 9)  prefs = ["home","cafe"];
  else if (hour < 12) prefs = ["lab","univ","library"];
  else if (hour < 14) prefs = ["cafe","home"];
  else if (hour < 18) prefs = ["lab","univ","library","gym"];
  else if (hour < 21) prefs = ["home","cafe","garden"];
  else                prefs = ["home","library"];
  var biased = choices.filter(function(x){ return prefs.indexOf(x) >= 0; });
  if (biased.length) choices = biased.concat(choices);
  return choices[Math.floor(randVal * choices.length)] || current;
}

function walkPlaceTo(targetTs){
  var cursor = BIRTH, place = "home", step = 0;
  if (targetTs <= BIRTH) return "home";
  while (step < 200000){
    var rr = mulberry(hash32(step * 2654435761 + 0xBADC0DE));
    var duration = 40 + Math.floor(rr() * 81);
    if (cursor + duration * 60000 > targetTs) break;
    var hourOfStep = new Date(cursor + 60000).getHours();
    place = pickNextPlace(place, hourOfStep, rr());
    cursor += duration * 60000;
    step++;
  }
  return place;
}
var placeCache = {};
function placeAtTime(ts){
  var k = Math.floor((ts - BIRTH) / 3600000);
  if (placeCache[k] !== undefined) return placeCache[k];
  placeCache[k] = walkPlaceTo(ts);
  return placeCache[k];
}

function actsFor(place, p){
  var list = PLACE_ACTS[place] || PLACE_ACTS.home;
  var out = list.filter(function(a){ return !a.rare && a.p.indexOf(p) >= 0; });
  if (!out.length) out = list.filter(function(a){ return !a.rare; });
  if (!out.length) out = PLACE_ACTS.home;
  return out;
}
function rareActsFor(place, p){
  var list = PLACE_ACTS[place] || [];
  var out = list.filter(function(a){ return a.rare && a.p.indexOf(p) >= 0; });
  if (!out.length) out = list.filter(function(a){ return a.rare; });
  return out;
}
function specialActsFor(time, place, p){
  var key = (time.getMonth()+1) + "/" + time.getDate();
  var arr = SPECIAL_DAYS[key];
  if (!arr || !arr.length) return [];
  if (p === 3) return [];
  return arr.map(function(a){ return {t:a.t, p:[0,1,2], s:a.s, e:a.e, m:a.m, f:a.f}; });
}
function period(h){ return h<5?3:h<9?0:h<17?1:h<21?2:3; }
function dayKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* ---- 从出生至今全量重算 ---- */
function buildLife(now){
  var st = {
    energy:70, mood:70, full:60, curio:60,
    skills:{obs:0,craft:0,cook:0,plant:0,read:0},
    log:[], diary:[], shelf:[], rain:false
  };
  var total = Math.floor((now - BIRTH)/TICK);
  if (total < 1) total = 1;
  if (total > MAX_TICKS) total = MAX_TICKS;
  var day = null, dayBuf = [], prev = null;

  var ALL_FINDS = FINDS.concat(prefs.customFinds);

  /* 位置游走状态：绝对时间戳，与 walkPlaceTo / mapState 完全一致的规则 */
  var posCursor = BIRTH, posPlace = "home", posStep = 0;

  for (var i=0;i<total;i++){
    var ts = BIRTH + (i+1)*TICK;
    var time = new Date(ts);
    var r = mulberry(i*2654435761 ^ 0x9E3779B9);
    var k = dayKey(time);
    if (day === null) day = k;
    if (k !== day){ diaryFor(st, day, dayBuf, ts - TICK); day = k; dayBuf = []; }

    var weather = mulberry(Math.floor(i/4)*40503 ^ 0x5F356495);
    st.rain = weather() < 0.28;
    if (realWeatherCache.isRaining !== null && (now - ts) < 2 * TICK) st.rain = realWeatherCache.isRaining;

    var p = period(time.getHours());

    while (true){
      var prr = mulberry(hash32(posStep * 2654435761 + 195935983));
      var pdur = 40 + Math.floor(prr() * 81);
      var pNext = posCursor + pdur * 60000;
      if (pNext > ts) break;
      var hourOfStep = new Date(posCursor + 60000).getHours();
      posPlace = pickNextPlace(posPlace, hourOfStep, prr());
      posCursor = pNext;
      posStep++;
    }

    var pool = actsFor(posPlace, p);
    if (!st.rain){
      var dry = pool.filter(function(a){ return !a.rain; });
      if (dry.length) pool = dry;
    }
    if (st.energy < 25){
      var restful = pool.filter(function(a){ return a.e > 0; });
      if (restful.length) pool = restful.concat(restful, pool);
    }
    if (st.full < 45){
      var edible = pool.filter(function(a){ return a.f; });
      if (edible.length) pool = edible.concat(edible, pool);
    }
    var act = pick(pool, r);
    for (var tries = 0; tries < 4 && act.t === prev; tries++) act = pick(pool, r);

    var rareList = rareActsFor(posPlace, p);
    if (rareList.length && r() < 0.05) act = pick(rareList, r);
    var spList = specialActsFor(time, posPlace, p);
    if (spList.length && r() < 0.3) act = pick(spList, r);
    prev = act.t;

    st.energy = clamp(st.energy + act.e + 5);
    st.mood   = clamp(st.mood + act.m - 2);
    st.full   = clamp(st.full + (act.f || 0) - 5);
    st.curio  = clamp(st.curio + (act.s === "obs" ? 6 : 3) - 3);
    if (act.s) st.skills[act.s] += 1;

    var entry = {ts:ts, t:act.t, rain:st.rain, place:posPlace};
    if (r() < 0.12){
      var cand = ALL_FINDS.filter(function(f){
        var need = f.r===3?0.05:f.r===2?0.28:f.r===1?0.65:1;
        return r() < need;
      });
      var found = cand.length ? pick(cand, r) : pick(ALL_FINDS, r);
      if (!st.shelf.some(function(x){ return x.n === found.n; })){
        st.shelf.push({n:found.n, d:found.d, r:found.r, ts:ts});
        entry.found = found.n;
        st.mood = clamp(st.mood + 6);
      }
    }
    st.log.push(entry);
    dayBuf.push(entry);
    if (st.log.length > 600) st.log = st.log.slice(-300);
  }
  st.today = dayBuf;
  return st;
}

function diaryFor(st, key, buf, ts){
  if (!buf.length) return;
  var r = mulberry(ts/TICK ^ 0x1B873593);
  var open = st.mood > 72 ? pick(["今天是好天。","今天什么都挺顺。","今天我很喜欢。"], r)
           : st.mood > 45 ? pick(["今天普普通通。","今天过得很慢。","今天没什么大事。"], r)
           : pick(["今天有点没劲。","今天屋子里太安静了。","今天我有点想你。"], r);
  var a = pick(buf, r).t, b = pick(buf, r).t;
  var got = buf.filter(function(e){ return e.found; }).map(function(e){ return e.found; });
  var lines = [open, "我" + a + "。"];
  if (b !== a) lines.push("后来又" + b + "。");
  if (got.length) lines.push("捡到了" + got.join("、") + "，放进柜子了。");
  lines.push(st.energy < 35 ? "有点累，先睡了。"
    : pick(["明天想再去阳台看看。","明天你要是来，我把东西都拿给你看。","晚安。"], r));
  st.diary.unshift({key:key, ts:ts, text:lines.join("\n"), mood:st.mood});
  if (st.diary.length > 60) st.diary.pop();
}

function dur(ms){
  var m = Math.max(0, Math.round(ms/60000));
  var h = Math.floor(m/60); m = m%60;
  return h ? (h+"h"+(m?two(m)+"m":"")) : (m+"m");

/* ================= 陪着你屏 ================= */
function elapsed(){
  var t = prefs.timer;
  if (!t) return 0;
  return t.acc + (t.running && t.startedAt ? (Date.now() - t.startedAt) : 0);
}

var RUN_LINES = [
  {upTo:5,  t:"它刚在你脚边趴下来，尾巴搭在你的鞋上。"},
  {upTo:15, t:"它看了一眼你的屏幕，又看了一眼你。没说话。"},
  {upTo:25, t:"它把一只爪子搭在你的手腕上。意思是：别停。"},
  {upTo:40, t:"它趴着没动。你也别动。"},
  {upTo:60, t:"它把水杯往你手边推了一点。喝一口，接着来。"},
  {upTo:90, t:"它已经守到腿麻了，还在守。"},
  {upTo:1e9,t:"够了。它站起来挡在你和屏幕中间。<b>去休息。</b>"}
];
var NUDGE = [
  "你已经切出去 %n 次了。我数着。",
  "第 %n 次切走。它每次都抬头，每次你都不在。",
  "%n 次。我不催你，我只是记下来了。",
  "%n 次了，乖乖。回来。"
];
function paintFoxline(){
  var t = prefs.timer;
  var el = $("foxline");
  if (!t){
    var today = recordsOn(new Date());
    if (today.length){
      el.innerHTML = "今天你已经陪它坐了 <b>"+dur(today.reduce(function(a,b){return a+b.ms;},0))+"</b>。它记得每一分钟。";
    } else {
      var h = new Date().getHours();
      el.innerHTML = h < 11 ? "它在等你开始。不急，先坐下来。"
        : h < 19 ? "今天还没有开始过。它没催你，它只是一直朝这边看。"
        : "今天还空着。哪怕十分钟也算，按一下开始。";
    }
    return;
  }
  var m = elapsed()/60000;
  var line = RUN_LINES.filter(function(x){ return m <= x.upTo; })[0].t;
  if (!t.running) line = "暂停了。它也停下来，等着你。";
  var html = line;
  if (t.hidden >= 3){
    var pickN = NUDGE[Math.min(NUDGE.length-1, Math.floor(t.hidden/3)-1)] || NUDGE[NUDGE.length-1];
    html += '<span class="nudge">'+pickN.replace("%n", t.hidden)+'</span>';
  }
  el.innerHTML = html;
}
function paintTimer(){
  var t = prefs.timer;
  var ms = elapsed();
  var big = $("bigtime");
  big.textContent = hhmmss(ms);
  if (t) big.classList.remove("idle"); else big.classList.add("idle");
  $("tstate").textContent = !t ? "还没开始"
    : t.running ? ("从 "+hm(t.start)+" 开始，正在走")
    : ("从 "+hm(t.start)+" 开始，已暂停");
  $("tStart").hidden = !!t;
  $("tPause").hidden = !t;
  $("tStop").hidden = !t;
  if (t) $("tPause").textContent = t.running ? "暂停" : "继续";
  paintFoxline();
}
function paintTags(){
  var row = $("tagRow");
  row.innerHTML = prefs.tags.map(function(g){
    return '<button class="chip" data-tag="'+escapeHtml(g)+'" aria-pressed="'+(prefs.lastTag===g)+'">'+escapeHtml(g)+'</button>';
  }).join("") + '<button class="chip add" id="tagAdd">+ 新标签</button>';
}

function sameDay(a,b){ return dayKey(a) === dayKey(b); }
function recordsOn(d){
  return prefs.records.filter(function(r){ return sameDay(new Date(r.start), d); })
    .sort(function(a,b){ return b.start - a.start; });
}
function startOfWeek(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var wd = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - wd);
  return x;
}
function tagTotals(list){
  var map = {};
  list.forEach(function(r){ var k = r.tag || "未标"; map[k] = (map[k]||0) + r.ms; });
  return Object.keys(map).map(function(k){ return {tag:k, ms:map[k]}; })
    .sort(function(a,b){ return b.ms - a.ms; });
}
function tagOptions(sel){
  var opts = prefs.tags.slice();
  if (sel && opts.indexOf(sel) < 0) opts.unshift(sel);
  return '<option value=""'+(sel?"":" selected")+'>（无标签）</option>' + opts.map(function(g){
    return '<option value="'+escapeHtml(g)+'"'+(g===sel?" selected":"")+'>'+escapeHtml(g)+'</option>';
  }).join("");
}
function recRow(r){
  var html = '<div class="rec">'
    + '<time>'+hm(r.start)+'–'+hm(r.end)+'</time>'
    + '<span class="ti">'+(r.title ? escapeHtml(r.title) : '<span style="color:#B9B6B1">没写做什么</span>')+'</span>'
    + (r.tag ? '<span class="tg">'+escapeHtml(r.tag)+'</span>' : '<span class="tg" style="opacity:.5">未标</span>')
    + '<span class="ms">'+dur(r.ms)+'</span>'
    + '<button class="ed" data-act="edit" data-id="'+r.id+'" aria-label="编辑这条记录">改</button>'
    + '</div>';
  if (editingId === r.id){
    html += '<div class="editBox" data-id="'+r.id+'">'
      + '<div class="two"><input type="time" data-f="s" value="'+hm(r.start)+'"><span class="sep">到</span><input type="time" data-f="e" value="'+hm(r.end)+'"></div>'
      + '<input type="text" data-f="t" maxlength="40" placeholder="做了什么" value="'+escapeHtml(r.title||"")+'">'
      + '<select data-f="g">'+tagOptions(r.tag)+'</select>'
      + '<div class="row"><button class="btn primary" data-act="save" data-id="'+r.id+'">保存</button>'
      + '<button class="btn quiet" data-act="cancel">算了</button>'
      + '<button class="btn danger" data-act="del" data-id="'+r.id+'">删除</button>'
      + '<span class="hint" data-hint="1"></span></div></div>';
  }
  return '<li>'+html+'</li>';
}
function paintViews(){
  var html = "", now = new Date(), i;
  if (view === "day"){
    var list = recordsOn(now);
    var total = list.reduce(function(a,b){ return a+b.ms; }, 0);
    html += '<p class="sum"><b>'+(total?dur(total):"0m")+'</b><span>'+(now.getMonth()+1)+' 月 '+now.getDate()+' 日 · '+list.length+' 段</span></p>';
    html += list.length ? '<ul class="recs">'+list.map(recRow).join("")+'</ul>'
      : '<p class="empty">今天还没有记录。按一下开始就有了。</p>';
  } else if (view === "week"){
    var s = startOfWeek(now), days = [], maxMs = 1;
    for (i=0;i<7;i++){
      var d = new Date(s.getFullYear(), s.getMonth(), s.getDate()+i);
      var l = recordsOn(d), ms = l.reduce(function(a,b){ return a+b.ms; }, 0);
      days.push({d:d, ms:ms, today:sameDay(d, now)});
      if (ms > maxMs) maxMs = ms;
    }
    var wtotal = days.reduce(function(a,b){ return a+b.ms; }, 0);
    var names = ["一","二","三","四","五","六","日"];
    html += '<p class="sum"><b>'+(wtotal?dur(wtotal):"0m")+'</b><span>本周 · 平均每天 '+dur(wtotal/7)+'</span></p>';
    html += '<div class="wbars">' + days.map(function(x,k){
      return '<div class="wbar'+(x.today?" today":"")+'"><span>'+names[k]+'</span><span class="lane"><i style="width:'+Math.round(x.ms/maxMs*100)+'%"></i></span><b>'+(x.ms?dur(x.ms):"—")+'</b></div>';
    }).join("") + '</div>';
    var wl = [];
    days.forEach(function(x){ wl = wl.concat(recordsOn(x.d)); });
    var tt = tagTotals(wl);
    if (tt.length){
      var tmax = tt[0].ms || 1;
      html += '<p class="h4">按标签</p><div class="tagsum">' + tt.map(function(x){
        return '<div><span>'+escapeHtml(x.tag)+'</span><span class="lane"><i style="width:'+Math.round(x.ms/tmax*100)+'%"></i></span><b>'+dur(x.ms)+'</b></div>';
      }).join("") + '</div>';
    } else {
      html += '<p class="empty">这一周还没有记录。</p>';
    }
  } else {
    var y = now.getFullYear(), mo = now.getMonth();
    var first = new Date(y, mo, 1), lead = (first.getDay()+6)%7;
    var count = new Date(y, mo+1, 0).getDate();
    var mtotal = 0, activeDays = 0, cells = "";
    var dows = ["一","二","三","四","五","六","日"];
    for (i=0;i<7;i++) cells += '<div class="dow">'+dows[i]+'</div>';
    for (i=0;i<lead;i++) cells += '<div class="cell blank"></div>';
    for (i=1;i<=count;i++){
      var dd = new Date(y, mo, i);
      var ms2 = recordsOn(dd).reduce(function(a,b){ return a+b.ms; }, 0);
      mtotal += ms2;
      if (ms2 > 0) activeDays++;
      var k2 = Math.min(1, ms2/(4*3600000));
      var bg = ms2 ? 'background:rgba(39,131,222,'+(0.12+k2*0.68).toFixed(2)+')' : '';
      cells += '<div class="cell'+(ms2?" on":"")+(sameDay(dd,now)?" today":"")+'" style="'+bg+'" title="'+(mo+1)+'/'+i+' '+(ms2?dur(ms2):"没有记录")+'">'+i+'</div>';
    }
    html += '<p class="sum"><b>'+(mtotal?dur(mtotal):"0m")+'</b><span>'+(mo+1)+' 月 · 有记录的 '+activeDays+' 天</span></p>';
    html += '<div class="cal">'+cells+'</div>';
    html += '<p class="foot">颜色越深，那天坐得越久。空白的日子就是空白，没有别的意思。</p>';
  }
  $("vpanel").innerHTML = html;
}

/* ================= 狐狸地图 ================= */
function mapState(now){
  var elapsed=Math.max(0,now-BIRTH), cursor=0, current="home", lastStart=0, lastDuration=60, step=0;
  var maxSteps=Math.min(200000, Math.ceil(elapsed/2400000)+2);
  while(cursor<elapsed && step<maxSteps){
    var rr=mulberry(hash32(step*2654435761 + 0xBADC0DE));
    var duration=40+Math.floor(rr()*81);
    lastStart=cursor; lastDuration=duration;
    if(cursor+duration*60000>elapsed) break;
    var hourOfStep = new Date(BIRTH + cursor + 60000).getHours();
    current = pickNextPlace(current, hourOfStep, rr());
    cursor+=duration*60000; step++;
  }
  var stay=Math.max(0,Math.floor((elapsed-lastStart)/60000));
  return {place:current,duration:lastDuration,stay:stay,slot:step,seed:hash32(step*99991)};
}

function chooseMapText(place, state, now){
  var p=MAP_PLACES[place], hour=new Date(now).getHours();
  var rain=st.rain;
  var r=mulberry(hash32(Math.floor(now/3600000)*31337 + p.x+p.y));
  var arr=p.base.slice();
  if(rain && p.rain) arr=arr.concat(p.rain);
  if(st.curio>72 && p.science) arr=arr.concat(p.science);
  if(st.energy>72 && p.energetic) arr=arr.concat(p.energetic);
  if(st.energy<35 && p.low) arr=arr.concat(p.low);
  var m=state && state.stayMinutes || 0;
  if(m>=150 && p.long) arr=arr.concat(p.long);
  if(rain && hour>=21 && place==="home") arr.push("雨声一直没有停。\n听着听着就困了。");
  var text=pick(arr,r);
  if(r()<0.035){
    var rs=MAP_PLACES[place].rare || [];
    if(rs.length) text=pick(rs,r);
    else {
      var ev=MAP_PLACES[place].science||[]; if(ev.length) text=pick(ev,r);
    }
  }
  return text;
}

function renderMap(){
  var now=Date.now(), ms=mapState(now), place=MAP_PLACES[ms.place];
  var infoState={stayMinutes:ms.stay};
  var text=chooseMapText(ms.place,infoState,now);
  var svg=$("mapPlaces");
  var out="";
  MAP_KEYS.forEach(function(k){
    var p=MAP_PLACES[k], active=k===ms.place;
    out += '<g class="placeNode '+(active?'active':'')+'" data-place="'+k+'" transform="translate('+p.x+','+p.y+')">'+
      '<rect class="bubble" x="-58" y="-35" width="116" height="70" rx="14" fill="'+p.color+'"/>'+
      '<text class="emoji" x="0" y="-2" text-anchor="middle">'+p.icon+'</text>'+
      '<text class="label" x="0" y="24" text-anchor="middle">'+p.name+'</text></g>';
  });
  svg.innerHTML=out;
  var marker=$("foxMarker");
  marker.setAttribute("opacity","1");
  marker.setAttribute("transform","translate("+place.x+","+(place.y-55)+")");
  var info=$('mapInfo');
  var hour=new Date(now).getHours();
  info.innerHTML='<div class="placeTitle">'+place.icon+' '+place.name+(place.name==="研究所"?' · 今天的脑子有点忙':'')+'</div>'+
    '<div class="placeMeta">现在 '+fmt(now)+' · 已待 '+ms.stay+' 分钟 · 这次大约停留 '+ms.duration+' 分钟</div>'+
    '<div class="placeText">'+escapeHtml(text).replace(/\n/g,'<br>')+'</div>';
  var legend=["路线会经过相邻地点","停留时间约 40–120 分钟","天气和状态会轻轻影响路线","偶尔会有没见过的小事情"];
  $('mapLegend').innerHTML=legend.map(function(x){return '<span class="mapChip">'+x+'</span>';}).join('');
  $('mapClock').textContent=two(hour)+":"+two(new Date(now).getMinutes());
  Array.prototype.forEach.call(document.querySelectorAll('.placeNode'),function(node){
    node.addEventListener('click',function(){
      var k=node.dataset.place, p=MAP_PLACES[k];
      var tx=chooseMapText(k,{stayMinutes:k===ms.place?ms.stay:0},now);
      $('mapInfo').innerHTML='<div class="placeTitle">'+p.icon+' '+p.name+'</div><div class="placeMeta">'+(k===ms.place?'现在就在这里。':'今天路过这里。')+'</div><div class="placeText">'+escapeHtml(tx).replace(/\n/g,'<br>')+'</div>';
    });
  });
}

    "把便签压在石头底下，这样风就吹不跑了"
  ], r), rain:st.rain});
  st.mood = clamp(st.mood + 4);
  st.skills.read += 1;
  $("noteText").value = "";
  $("noteHint").textContent = "它看到了。";
  $("noteBox").classList.remove("open");
  selectTab("log"); paintScene();
});

/* ---- 计时交互 ---- */
$("tagRow").addEventListener("click", function(ev){
  var add = ev.target.closest("#tagAdd");
  if (add){
    var name = (window.prompt("新标签叫什么？", "") || "").trim().slice(0,8);
    if (name && prefs.tags.indexOf(name) < 0){
      prefs.tags.push(name);
      prefs.lastTag = name;
      writePrefs();
      paintTags();
    }
    return;
  }
  var chip = ev.target.closest("[data-tag]");
  if (!chip) return;
  var g = chip.dataset.tag;
  prefs.lastTag = (prefs.lastTag === g) ? "" : g;
  writePrefs();
  paintTags();
});
$("tagRow").addEventListener("contextmenu", function(ev){
  var chip = ev.target.closest("[data-tag]");
  if (!chip) return;
  ev.preventDefault();
  var g = chip.dataset.tag;
  if (window.confirm("删掉标签「"+g+"」吗？已经记下的记录不会受影响。")){
    prefs.tags = prefs.tags.filter(function(x){ return x !== g; });
    if (prefs.lastTag === g) prefs.lastTag = "";
    writePrefs(); paintTags();
  }
});

$("tStart").addEventListener("click", function(){
  var now = Date.now();
  prefs.timer = {start:now, startedAt:now, acc:0, running:true, hidden:0};
  writePrefs();
  paintTimer();
});
$("tPause").addEventListener("click", function(){
  var t = prefs.timer; if (!t) return;
  if (t.running){
    t.acc += Date.now() - t.startedAt;
    t.running = false; t.startedAt = null;
  } else {
    t.startedAt = Date.now(); t.running = true;
  }
  writePrefs(); paintTimer();
});
$("tStop").addEventListener("click", function(){
  var t = prefs.timer; if (!t) return;
  var ms = elapsed();
  var end = Date.now();
  if (ms < 30000){
    if (!window.confirm("还不到半分钟，也要记下来吗？")){ return; }
  }
  var rec = {
    id: "r"+t.start,
    start: t.start,
    end: end,
    ms: ms,
    title: $("tTitle").value.trim().slice(0,40),
    tag: prefs.lastTag || ""
  };
  prefs.records.push(rec);
  prefs.records.sort(function(a,b){ return a.start - b.start; });
  prefs.timer = null;
  writePrefs();
  $("tTitle").value = "";
  st.mood = clamp(st.mood + Math.min(8, Math.round(ms/600000)));
  paintTimer(); paintViews(); paintScene(); paintPanel();
});

/* ---- 记录编辑 ---- */
$("vpanel").addEventListener("click", function(ev){
  var btn = ev.target.closest("[data-act]");
  if (!btn) return;
  var act = btn.dataset.act;
  if (act === "edit"){ editingId = btn.dataset.id; paintViews(); return; }
  if (act === "cancel"){ editingId = null; paintViews(); return; }
  if (act === "del"){
    if (!window.confirm("删掉这一条记录吗？")) return;
    prefs.records = prefs.records.filter(function(r){ return r.id !== btn.dataset.id; });
    editingId = null; writePrefs(); paintViews(); paintScene(); paintPanel();
    return;
  }
  if (act === "save"){
    var box = $("vpanel").querySelector('.editBox[data-id="'+btn.dataset.id+'"]');
    var rec = prefs.records.filter(function(r){ return r.id === btn.dataset.id; })[0];
    if (!box || !rec) return;
    var sv = box.querySelector('[data-f="s"]').value;
    var evv = box.querySelector('[data-f="e"]').value;
    var hint = box.querySelector('[data-hint]');
    if (!sv || !evv){ hint.textContent = "时间不能空着。"; return; }
    var base = new Date(rec.start);
    function mk(v){
      var p = v.split(":");
      return new Date(base.getFullYear(), base.getMonth(), base.getDate(), +p[0], +p[1], 0, 0).getTime();
    }
    var s2 = mk(sv), e2 = mk(evv);
    if (e2 <= s2) e2 += 86400000;
    if (e2 - s2 > 20*3600000){ hint.textContent = "这段时间太长了，检查一下。"; return; }
    rec.start = s2; rec.end = e2; rec.ms = e2 - s2;
    rec.title = box.querySelector('[data-f="t"]').value.trim().slice(0,40);
    rec.tag = box.querySelector('[data-f="g"]').value;
    prefs.records.sort(function(a,b){ return a.start - b.start; });
    editingId = null; writePrefs(); paintViews(); paintScene(); paintPanel();
  }
});

/* ---- 摸鱼计数 ---- */
document.addEventListener("visibilitychange", function(){
  var t = prefs.timer;
  if (!t || !t.running) return;
  if (document.hidden){
    t.hidden = (t.hidden || 0) + 1;
    writePrefs();
  } else {
    paintTimer();
  }
});

  /* ---- 小惊喜 ---- */
  var EK = "fox_eggs_v1";
  function eggs(){ try{ return JSON.parse(localStorage.getItem(EK)) || {}; }catch(e){ return {}; } }
  function saveEggs(o){ try{ localStorage.setItem(EK, JSON.stringify(o)); }catch(e){} }

  var whisperBox = null;
  function whisper(text, hold){
    if (!whisperBox){
      whisperBox = document.createElement("div");
      whisperBox.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:26px;max-width:320px;padding:12px 16px;border-radius:14px;background:rgba(38,34,30,.92);color:#F3EDE4;font-size:13px;line-height:1.9;letter-spacing:.3px;white-space:pre-line;z-index:9999;opacity:0;transition:opacity .6s;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.18)";
      document.body.appendChild(whisperBox);
    }
    whisperBox.textContent = text;
    whisperBox.style.opacity = "1";
    clearTimeout(whisperBox._t);
    whisperBox._t = setTimeout(function(){ whisperBox.style.opacity = "0"; }, hold || 7000);
  }

  function bump(key){
    var e = eggs();
    e[key] = (e[key] || 0) + 1;
    saveEggs(e);
    return e[key];
  }
  function once(key){
    var e = eggs();
    if (e["once_" + key]) return false;
    e["once_" + key] = 1;
    saveEggs(e);
    return true;
  }

  /* 摸摸头，摸久了它会说点别的 */
  var patEl = document.getElementById("pat");
  if (patEl) patEl.addEventListener("click", function(){
    var n = bump("pat");
    if (n === 7) whisper("它今天被摸了七次了。\n尾巴一直没停下来。");
    else if (n === 20) whisper("它把头往你手心里又送了一点。\n这个动作它是跟谁学的，不好说。");
    else if (n === 50) whisper("它突然安静下来，很认真地看着你。\n然后趴下，靠在你手边睡了。");
    else if (n === 100) whisper("一百次了。\n它好像已经不记得没有你的日子了。");
  });

  /* 顶上那行字，多点几下 */
  var clockEl = document.getElementById("clock");
  if (clockEl) clockEl.addEventListener("click", function(){
    var n = bump("clock");
    if (n % 5 === 0){
      var lines = [
        "这些天它都记着。\n哪天你来得晚，它也记着，只是不说。",
        "它数日子的方式很笨。\n一天一颗石头，已经摆不下了。",
        "你不在的时候它也在长大。\n只是长得很慢，好像在等你。",
        "它说，时间这个东西，只有在等人的时候才有形状。"
      ];
      whisper(lines[Math.floor(Math.random() * lines.length)]);
    }
  });

  /* 名字 */
  var lastSeenName = "";
  function checkName(){
    var el = document.getElementById("name");
    if (!el) return;
    var nm = ((el.value !== undefined ? el.value : el.textContent) || "").trim();
    if (!nm || nm === lastSeenName) return;
    lastSeenName = nm;
    if (nm === "许墨" || nm === "墨墨"){
      whisper("它愣了一下，然后很自然地应了。\n好像这个名字本来就是它的。", 9000);
    } else if (nm === "科学" || nm === "真理"){
      whisper("它警觉地回头看了一圈。\n确认那两只猫不在，才松了口气。");
    } else if (nm === "许小猫"){
      whisper("它抗议了一下。\n但也没有真的抗议。");
    } else if (nm.indexOf("云无印") >= 0 || nm === "小熊猫"){
      whisper("它不肯答应这个名字。\n它说这个名字已经有人用了，很重要的人。", 9000);
    }
  }
  setInterval(checkName, 1500);
  setTimeout(checkName, 800);

  /* 便签 */
  var noteSaveEl = document.getElementById("noteSave");
  if (noteSaveEl) noteSaveEl.addEventListener("click", function(){
    var ta = document.getElementById("noteText");
    var v = ta ? (ta.value || "") : "";
    if (!v) return;
    if (v.indexOf("蝴蝶是七彩的") >= 0 || v.indexOf("蝴蝶") >= 0){
      whisper("它把收藏柜里那只翅膀拿出来，放在了纸条旁边。\n然后很久都没有动。", 11000);
    } else if (v.indexOf("小熊猫不想吃年糕") >= 0){
      whisper("它立刻不闹了。\n很小心地趴到你手边，一声都不出。", 11000);
    } else if (v.indexOf("我爱你") >= 0){
      whisper("它把纸条叼进窝里，压在最底下。\n那是它放最重要的东西的地方。", 10000);
    } else if (v.indexOf("晚安") >= 0){
      whisper("它把灯关掉了一半。\n剩下的那一半留给你。");
    } else if (v.indexOf("辛苦") >= 0 || v.indexOf("累") >= 0){
      whisper("它没有说话，只是挤过来，把整个身子贴着你坐下。");
    } else if (v.indexOf("生日") >= 0){
      whisper("它一整天都在往收藏柜里跑。\n好像在准备什么。");
    }
  });

  /* 地图上的它 */
  var markerEl = document.getElementById("foxMarker");
  if (markerEl) markerEl.addEventListener("click", function(){
    var n = bump("marker");
    var lines = [
      "被你找到了。\n它抬头看了看天，没搞懂你是从哪个方向看它的。",
      "它站在原地没走。\n好像知道你在看。",
      "你每次找它，它都在。\n这件事它做得比谁都好。"
    ];
    whisper(lines[(n - 1) % lines.length]);
  });

  var mapWrap = document.getElementById("mapPlaces");
  if (mapWrap) mapWrap.addEventListener("click", function(ev){
    var node = ev.target;
    while (node && node !== mapWrap && !(node.className && String(node.className).indexOf("placeNode") >= 0)) node = node.parentNode;
    if (!node || node === mapWrap) return;
    var key = node.getAttribute("data-place") || node.getAttribute("data-key") || (node.textContent || "").trim().slice(0, 6);
    var n = bump("place_" + key);
    if (n !== 3) return;
    var deep = {
      "家": "这里最安静。\n因为它一直在等门响。",
      "大学": "它最喜欢生科楼下面那条路。\n说那里的味道让它想起一个人。",
      "研究所": "它在这里最乖。\n它说这里有人在做很重要的事，不能吵。",
      "图书馆": "它在这里看不懂书，但还是每次都来。\n它说光的角度很好。",
      "咖啡厅": "它每次都点牛奶。\n它知道你不吃酸的东西。",
      "植物园": "它在这里等蝴蝶。\n已经等了很多天了。",
      "体育馆": "它跑不快，但从来没有中途回头。"
    };
    var txt = deep[key];
    if (!txt){
      for (var k in deep){ if (key.indexOf(k) >= 0){ txt = deep[k]; break; } }
    }
    if (txt) whisper(txt, 9000);
  });

  /* 计时器 */
  var stopEl = document.getElementById("tStop");
  if (stopEl) stopEl.addEventListener("click", function(){
    setTimeout(function(){
      var n = bump("stop");
      if (n === 1){
        whisper("第一次把时间记下来了。\n这件事比你以为的更重要。");
      } else if (n % 10 === 0){
        whisper("你已经坚持了很多次了。\n它把每一次都记着，一次都没漏。");
      } else if (Math.random() < 0.35){
        var lines = [
          "做得很好。\n现在去喝点水。",
          "停下来也是一部分。\n不用愧疚。",
          "它在旁边看了你很久，一声都没出。\n怕打扰你。",
          "这段时间是你自己挣来的。\n谁也拿不走。"
        ];
        whisper(lines[Math.floor(Math.random() * lines.length)]);
      }
    }, 120);
  });

  /* 特别的日子 */
  (function(){
    var d = new Date();
    var key = (d.getMonth() + 1) + "/" + d.getDate();
    var greet = {
      "1/20": "今天整个屋子都被它重新摆过了。\n它说今天要好看一点。\n\n生日快乐。",
      "11/15": "它今天在窗台上摆了七样颜色不一样的东西。\n它分不清那些颜色。\n但它还是摆好了。",
      "6/19": "它今天格外黏人。\n走到哪里都要先确认你在不在。",
      "9/26": "今天是它来到这里的日子。\n它自己好像也知道。"
    };
    if (greet[key] && once("day_" + key + "_" + d.getFullYear())){
      setTimeout(function(){ whisper(greet[key], 14000); }, 2200);
    }
  })();

  /* 很晚了 */
  (function(){
    var h = new Date().getHours();
    if ((h >= 1 && h < 5) && once("latenight_" + new Date().toDateString())){
      setTimeout(function(){
        whisper("这个点了。\n它已经睡了，你也该睡了。\n\n明天再来看它，它不会跑掉。", 13000);
      }, 3000);
    }
  })();

  /* 很久没来 */
  (function(){
    var e = eggs();
    var now = Date.now();
    var last = e.lastVisit || 0;
    e.lastVisit = now;
    saveEggs(e);
    if (last && now - last > 3 * 24 * 3600 * 1000){
      setTimeout(function(){
        whisper("它在门口坐了很久。\n没有生气，只是有点闷。\n\n你回来了就好。", 13000);
      }, 2600);
    }
  })();

/* ---- 心跳 ---- */
paintTags();
paint();
setInterval(function(){
  if (prefs.timer) paintTimer();
}, 1000);
setInterval(function(){
  if (screenNow === "map") renderMap();
  var fresh = buildLife(Date.now());
  if (fresh.log.length !== st.log.length){
    st = fresh;
    if (screenNow === "fox"){ paintScene(); paintPanel(); }
    else if (screenNow === "map"){ renderMap(); }
    else { paintFoxline(); }
  }
}, 60*1000);
})();
